<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Survey Page</title>
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    #ss_survey_widget {
      width: 100%;
      height: 100vh;  /* full viewport height */
    }

    #ss_survey_widget iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div id="ss_survey_widget">
    <iframe
      id="ss_widget_frame"
      src="https://surveys.esurveydesigns.com/widget/Feature-Requests/tt-3rFmtYANV2d?">
    </iframe>
  </div>

  <script async id="ss-widget"
    src="https://abc1234d.surveysparrow.com/widget/tt-3rFmtYANV2d?customParams={}">
  </script>

  <script>
    function sparrowLaunch(opts) {
      var a=document,r=window;
      r.SS_WIDGET_TOKEN="tt-3rFmtYANV2d";
      r.SS_ACCOUNT="abc1234d.surveysparrow.com";
      if(!a.getElementById("ss-widget")){
        var s=a.createElement("script");
        s.src="https://"+r.SS_ACCOUNT+"/widget/"+r.SS_WIDGET_TOKEN+"?customParams="+JSON.stringify(opts);
        s.async=true;
        a.body.appendChild(s);
      }
    }
    sparrowLaunch({});
  </script>

</body>
</html>
