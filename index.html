<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Survey Page</title>

  <style>
    /* page background optional */
    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      font-family: sans-serif;
    }

    /* this is the box that holds the survey */
    #ss_survey_widget {
      width: 420px;          /* <-- change this to the size you want */
      height: 600px;         /* <-- change height too */
      margin: 0 auto;        /* center on the page */
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      position: relative;
    }

    /* make iframe fill the box */
    #ss_survey_widget iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0;
    }

    /* OPTIONAL: cap popup size from their CSS if they show as popup-small */
    [data-ss-share-mode="popup-small"] .ss-survey-launch__inner-container {
      max-width: 480px !important;
      max-height: 700px !important;
    }
  </style>
</head>
<body>

  <div id="ss_survey_widget">
    <iframe id="ss_widget_frame"
      allowfullscreen
      allow="camera; microphone"
      src="https://surveys.esurveydesigns.com/widget/Feature-Requests/tt-3rFmtYANV2d?">
    </iframe>
  </div>

  <!-- your survey sparrow script(s) go after this -->
  <!-- ... -->

</body>
</html>
